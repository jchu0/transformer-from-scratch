[project]
name = "transformer-from-scratch"
version = "0.1.0"
description = "A decoder-only transformer built from scratch in PyTorch, on the road to mechanistic interpretability research."
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = {text = "MIT"}
authors = []
keywords = ["transformer", "pytorch", "interpretability", "mechanistic-interpretability", "from-scratch"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "torch",
    "einops",
    "numpy",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
]
notebook = [
    "jupyter",
    "matplotlib",
]
interp = [
    "transformer-lens",   # induction-heads / interpretability phase
]

[project.scripts]
# transformer-from-scratch = "transformer_from_scratch.main:main"

[project.urls]
Homepage = "[https://github.com/username/transformer-from-scratch]"
Documentation = "[https://github.com/username/transformer-from-scratch#readme]"
Repository = "[https://github.com/username/transformer-from-scratch]"
Issues = "[https://github.com/username/transformer-from-scratch/issues]"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/transformer_from_scratch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.black]
line-length = 88
target-version = ["py310", "py311", "py312", "py313"]

[tool.ruff]
line-length = 88
target-version = "py310"
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black)
]

[tool.ruff.isort]
known-first-party = ["transformer_from_scratch"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
